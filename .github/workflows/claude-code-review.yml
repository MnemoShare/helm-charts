name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, release/0.x]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/package-lock.json'
      - '**/go.sum'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-review
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot bumps are gated by CI + auto-approve; fork PRs get no secrets
    # (public repo). Skip both before a runner starts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: MnemoShare/ci-workflows/.github/workflows/claude-review.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUTO_APPROVE_PRIVATE_KEY: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: read
