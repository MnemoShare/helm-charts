{{- if and .Values.networkPolicy.enabled (ne .Values.formatMigrations.mode "operator") }}
{{- $apiTargets := .Values.formatMigrations.networkPolicy.kubernetesApiTargets }}
{{- $fullname := include "mnemoshare.fullname" . }}
{{- $externalRelayUniverse := false }}
{{- if .Values.emailGateway.enabled }}
{{- $gatewayFacts := include "mnemoshare.emailGateway" . | fromJson }}
{{- range $gatewayFacts.profile.external_universes }}{{- if eq .id "email-relay-mongo" }}{{- $externalRelayUniverse = true }}{{- end }}{{- end }}
{{- end }}
{{- $cleanupHooks := "pre-delete" }}
{{- if eq .Values.formatMigrations.mode "automatic" }}
{{- $cleanupHooks = "post-install,post-upgrade,pre-delete" }}
{{- end }}
{{- if eq .Values.formatMigrations.mode "automatic" }}
{{- $databasePort := .Values.formatMigrations.networkPolicy.databasePort | int }}
{{- if eq $databasePort 0 }}
{{- $databasePort = include "mnemoshare.np.dbPort" . | int }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-format-migration
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: format-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-46"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "mnemoshare.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: format-migration
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- /* No CIDRs configured: the database port only, to any destination. */}}
    {{- include "mnemoshare.np.rule" (dict "ports" (list $databasePort) "cidrs" .Values.formatMigrations.networkPolicy.databaseCIDRs "anyDest" true) | nindent 4 }}
    {{- if $externalRelayUniverse }}
    {{- include "mnemoshare.np.rule" (dict "ports" (list .Values.emailGateway.relay.db.networkPolicyPort) "cidrs" (.Values.emailGateway.relay.db.networkPolicyCIDRs | default list) "anyDest" true) | nindent 4 }}
    {{- end }}
    {{- range $apiTargets }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports:
        - { protocol: TCP, port: {{ .port }} }
    {{- end }}
    {{- if not $apiTargets }}
    {{- /* Kubernetes API endpoint unknown: 443/6443 only, any destination. */}}
    {{- include "mnemoshare.np.rule" (dict "ports" (list 443 6443) "anyDest" true) | nindent 4 }}
    {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-format-migration-cleanup
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: format-migration-cleanup
  annotations:
    "helm.sh/hook": {{ $cleanupHooks }}
    "helm.sh/hook-weight": "-77"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "mnemoshare.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: format-migration-cleanup
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- range $apiTargets }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports:
        - { protocol: TCP, port: {{ .port }} }
    {{- end }}
    {{- if not $apiTargets }}
    {{- /* Kubernetes API endpoint unknown: 443/6443 only, any destination. */}}
    {{- include "mnemoshare.np.rule" (dict "ports" (list 443 6443) "anyDest" true) | nindent 4 }}
    {{- end }}
{{- end }}
