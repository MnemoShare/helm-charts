{{- if and .Values.migrationOperation.enabled (has .Values.migrationOperation.phase (list "plan" "apply" "verify")) }}
{{- $fullname := include "mnemoshare.fullname" . }}
{{- $phase := .Values.migrationOperation.phase }}
{{- $operationID := .Values.migrationOperation.operationId }}
{{- $fingerprint := include "mnemoshare.migrationOperationExpectedContractFingerprint" . }}
{{- $universe := .Values.migrationOperation.universe | default "primary" }}
{{- $planDigest := .Values.migrationOperation.planDigest | default "pending" }}
{{- $planFile := "/migration/primary-plan.json" }}
{{- $resultFile := "/migration/primary-result.json" }}
{{- $statusDirectory := "/var/run/mnemoshare-migration/status" }}
{{- $statusFile := printf "%s/status.json" $statusDirectory }}
{{- $jobName := printf "%s-migration-%s-%s" $fullname $phase $operationID | trunc 63 | trimSuffix "-" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration-operation
    mnemoshare.io/migration-operation-id: {{ $operationID | quote }}
    mnemoshare.io/migration-operation-phase: {{ $phase | quote }}
    mnemoshare.io/migration-operation-universe: {{ $universe | quote }}
    mnemoshare.io/migration-operation-plan-digest: {{ $planDigest | quote }}
  annotations:
    # This is intentionally not a Helm hook. The external controller owns
    # ordering, observes status, and retains failures for forward repair.
    mnemoshare.io/migration-operation-plan-file: {{ $planFile | quote }}
    mnemoshare.io/migration-operation-result-file: {{ $resultFile | quote }}
spec:
  backoffLimit: {{ .Values.migrationOperation.backoffLimit }}
  {{- if ne $phase "apply" }}
  activeDeadlineSeconds: {{ .Values.migrationOperation.uninstrumentedActiveDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "mnemoshare.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration-operation
        {{- include "mnemoshare.migrationOperationContractLabels" . | nindent 8 }}
        mnemoshare.io/migration-operation-id: {{ $operationID | quote }}
        mnemoshare.io/migration-operation-phase: {{ $phase | quote }}
        mnemoshare.io/migration-operation-universe: {{ $universe | quote }}
        mnemoshare.io/migration-operation-plan-digest: {{ $planDigest | quote }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mnemoshare.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migration-operation
          image: {{ include "mnemoshare.migrationOperationTargetImage" . | quote }}
          imagePullPolicy: {{ .Values.migrationOperation.targetImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              phase="$0"
              if [ "$phase" = "apply" ]; then
                # The emptyDir mount is kubelet-owned. Create the status parent
                # as the actual non-root caller so the binary can enforce its
                # caller-owned, non-world-writable filesystem contract.
                umask 077
                mkdir -p {{ $statusDirectory | quote }}
                chmod 0700 {{ $statusDirectory | quote }}
              fi
              set +e
              /usr/local/bin/mnemoshare-migrate "$phase" "$@"
              exit_code=$?
              set -e
              if [ "$phase" = "apply" ]; then
                # The migrate binary owns the typed terminal snapshot. Keeping
                # it intact lets the deployment supervisor observe the last
                # truthful checkpoint when apply succeeds or fails.
                :
              elif [ "$phase" = "plan" ] && [ -s {{ $resultFile | quote }} ]; then
                tr -d '\r\n' < {{ $resultFile | quote }} | cut -c 1-4096 > /dev/termination-log
              else
                if [ "$exit_code" -eq 0 ]; then outcome=success; else outcome=failure; fi
                printf '{"operationId":"%s","phase":"%s","universe":"%s","planDigest":"%s","outcome":"%s","exitCode":%s}\n' "{{ $operationID }}" "$phase" "{{ $universe }}" "{{ $planDigest }}" "$outcome" "$exit_code" > /dev/termination-log
              fi
              exit "$exit_code"
            - {{ $phase | quote }}
            - "--contract"
            - "embedded"
            - "--expect-contract-fingerprint"
            - {{ $fingerprint | quote }}
            {{- if eq $phase "plan" }}
            - "--output"
            - {{ $planFile | quote }}
            - "--result"
            - {{ $resultFile | quote }}
            {{- else }}
            - "--plan"
            - {{ $planFile | quote }}
            - "--expect-plan-digest"
            - {{ .Values.migrationOperation.planDigest | quote }}
            {{- if eq $phase "apply" }}
            - "--exclusive"
            - "--bootstrap-policy"
            - "provision-untracked"
            - "--status"
            - {{ $statusFile | quote }}
            - "--termination-log"
            - "/dev/termination-log"
            {{- end }}
            {{- end }}
          env:
            {{- include "mnemoshare.migrationOperationEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: migration-transport
              mountPath: /migration
            {{- if eq $phase "apply" }}
            - name: migration-status
              mountPath: /var/run/mnemoshare-migration
            {{- end }}
          {{- if eq $phase "apply" }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/mnemoshare-migrate", "status", "--file", {{ $statusFile | quote }}, "--termination-log", "/dev/termination-log", "--max-inactivity", "5m", "--absolute-deadline", "6h"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/usr/local/bin/mnemoshare-migrate", "status", "--file", {{ $statusFile | quote }}, "--termination-log", "/dev/termination-log", "--max-inactivity", "5m", "--absolute-deadline", "6h"]
            periodSeconds: 30
            failureThreshold: 1
          {{- end }}
      volumes:
        - name: migration-transport
          persistentVolumeClaim:
            claimName: {{ .Values.migrationOperation.transport.existingClaim | quote }}
        {{- if eq $phase "apply" }}
        - name: migration-status
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- define "mnemoshare.migrationOperationEnv" }}
{{ include "mnemoshare.productionEnvironment" . }}
- name: CUSTOMER_ID
  value: {{ required "customerId is required: set --set customerId=<your-tenant-slug> at install/upgrade time" .Values.customerId | quote }}
- name: DB_DRIVER
  value: {{ .Values.database.driver | default "mongodb" | quote }}
{{- if eq (.Values.database.driver | default "mongodb") "mongodb" }}
- name: MONGODB_URI
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecrets.mongodb | default (printf "%s-secrets" (include "mnemoshare.fullname" .)) }}
      key: mongodb-uri
- name: MONGODB_DATABASE
  value: {{ .Values.mongodb.external.database | quote }}
{{- else if eq .Values.database.driver "postgres" }}
- name: POSTGRES_DSN
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecrets.postgres | default (printf "%s-secrets" (include "mnemoshare.fullname" .)) }}
      key: postgres-dsn
{{- end }}
- name: ENCRYPTION_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecrets.encryption | default (printf "%s-secrets" (include "mnemoshare.fullname" .)) }}
      key: encryption-key
{{- end }}
