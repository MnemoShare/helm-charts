{{- if .Values.emailGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mnemoshare.fullname" . }}-email-gateway
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-gateway
  {{- with .Values.emailGateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.emailGateway.service.type }}
  {{- with .Values.emailGateway.service.externalTrafficPolicy }}
  {{- if not (has . (list "Cluster" "Local")) }}
  {{- fail (printf "emailGateway.service.externalTrafficPolicy must be Cluster or Local, got %v" (toString .)) }}
  {{- end }}
  {{- if has $.Values.emailGateway.service.type (list "LoadBalancer" "NodePort") }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- end }}
  {{- with .Values.emailGateway.service.loadBalancerSourceRanges }}
  {{- if ne $.Values.emailGateway.service.type "LoadBalancer" }}
  {{- fail "emailGateway.service.loadBalancerSourceRanges requires emailGateway.service.type LoadBalancer" }}
  {{- end }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
  - name: smtp
    port: {{ .Values.emailGateway.service.port }}
    targetPort: smtp
    protocol: TCP
  selector:
    {{- include "mnemoshare.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: email-gateway
{{- end }}
