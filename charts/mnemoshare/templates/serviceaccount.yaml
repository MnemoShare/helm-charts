{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: {{ include "mnemoshare.serviceAccountName" . }}
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if include "mnemoshare.keyguard.perComponent" . }}
{{- $components := list "api" }}
{{- if .Values.workflowWorker.enabled }}{{- $components = append $components "worker" }}{{- end }}
{{- if .Values.ices.enabled }}{{- $components = append $components "ices" }}{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: {{ include "mnemoshare.keyguard.componentSAName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "mnemoshare.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
