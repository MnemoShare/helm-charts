{{- if .Values.emailGateway.enabled }}
{{- /* Resolve TLS secret: emailGateway.tls.existingSecret → mtls.tls.existingSecret → none */}}
{{- $tlsSecret := .Values.emailGateway.tls.existingSecret }}
{{- if and (not $tlsSecret) .Values.mtls.tls.existingSecret }}
{{- $tlsSecret = .Values.mtls.tls.existingSecret }}
{{- end }}
{{- $seenListenPorts := dict }}
{{- $hasSMTPPort := false }}
{{- $hasLowPort := false }}
{{- $minPort := 25 }}
{{- if $tlsSecret }}
{{- /* Without a TLS secret LISTEN_PORTS is fixed to 25:plain and listenPorts is ignored, so it is only validated here. */}}
{{- range $listener := splitList "," .Values.emailGateway.listenPorts }}
{{- $listener = trim $listener }}
{{- if $listener }}
{{- if not (regexMatch "^[0-9]+(:(plain|starttls|tls))?$" $listener) }}{{- fail (printf "emailGateway.listenPorts contains invalid listener %q" $listener) }}{{- end }}
{{- $portText := regexFind "^[0-9]+" $listener }}
{{- $port := atoi $portText }}
{{- if or (lt $port 1) (gt $port 65535) }}{{- fail (printf "emailGateway.listenPorts contains invalid port %s" $portText) }}{{- end }}
{{- $canonicalPort := printf "%d" $port }}
{{- if ne $portText $canonicalPort }}{{- fail (printf "emailGateway.listenPorts port %s is not canonically spelled as %s" $portText $canonicalPort) }}{{- end }}
{{- if hasKey $seenListenPorts $canonicalPort }}{{- fail (printf "emailGateway.listenPorts contains duplicate port %s" $canonicalPort) }}{{- end }}
{{- if lt $port 1024 }}{{- $hasLowPort = true }}{{- end }}
{{- if lt $port $minPort }}{{- $minPort = $port }}{{- end }}
{{- $_ := set $seenListenPorts $canonicalPort true }}
{{- if eq $port 25 }}{{- $hasSMTPPort = true }}{{- end }}
{{- end }}
{{- end }}
{{- if not $hasSMTPPort }}{{- fail "emailGateway.listenPorts must include port 25 while the Service targets the fixed smtp port" }}{{- end }}
{{- else }}
{{- $hasLowPort = true }}
{{- end }}
{{- $relayMode := or (eq .Values.emailGateway.mode "relay") (eq .Values.emailGateway.mode "inbound-relay") }}
{{- $relayClaim := .Values.emailGateway.relay.persistence.existingClaim | default (printf "%s-relay-spool" (include "mnemoshare.fullname" .)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mnemoshare.fullname" . }}-email-gateway
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-gateway
spec:
  replicas: {{ .Values.emailGateway.replicas }}
  selector:
    matchLabels:
      {{- include "mnemoshare.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: email-gateway
  template:
    metadata:
      labels:
        {{- include "mnemoshare.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: email-gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mnemoshare.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- $podSC := deepCopy (.Values.podSecurityContext | default dict) }}
        {{- if $hasLowPort }}
        {{- /* The SMTP listener sits below 1024 while the container runs as a
             non-root user with every capability dropped; this safe sysctl is
             what lets it bind. NET_BIND_SERVICE does not help a non-root
             process without file capabilities on the binary. The sysctl is per
             pod network namespace, so an operator value above the lowest
             listener port is replaced with 0 in this pod's copy only. */}}
        {{- $sysctls := list }}
        {{- $haveLowPortSysctl := false }}
        {{- range ($podSC.sysctls | default list) }}
        {{- if eq .name "net.ipv4.ip_unprivileged_port_start" }}
        {{- $haveLowPortSysctl = true }}
        {{- $v := toString .value }}
        {{- if not (regexMatch "^[0-9]+$" $v) }}{{- fail (printf "podSecurityContext.sysctls: net.ipv4.ip_unprivileged_port_start must be a plain integer, got %q" $v) }}{{- end }}
        {{- if gt (atoi $v) $minPort }}{{- $sysctls = append $sysctls (dict "name" .name "value" "0") }}{{- else }}{{- $sysctls = append $sysctls . }}{{- end }}
        {{- else }}
        {{- $sysctls = append $sysctls . }}
        {{- end }}
        {{- end }}
        {{- if not $haveLowPortSysctl }}{{- $sysctls = append $sysctls (dict "name" "net.ipv4.ip_unprivileged_port_start" "value" "0") }}{{- end }}
        {{- $_ := set $podSC "sysctls" $sysctls }}
        {{- end }}
        {{- toYaml $podSC | nindent 8 }}
      containers:
      - name: email-gateway
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/email-gateway"]
        ports:
        - name: smtp
          containerPort: 25
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: {{ .Values.environment | default "production" | quote }}
        - name: GATEWAY_MODE
          value: {{ .Values.emailGateway.mode | quote }}
        {{- if $tlsSecret }}
        - name: LISTEN_PORTS
          value: {{ .Values.emailGateway.listenPorts | quote }}
        - name: TLS_CERT_PATH
          value: "/etc/tls/tls.crt"
        - name: TLS_KEY_PATH
          value: "/etc/tls/tls.key"
        {{- else }}
        - name: LISTEN_PORTS
          value: "25:plain"
        {{- end }}
        - name: GATEWAY_HOSTNAME
          value: {{ .Values.emailGateway.hostname | quote }}
        # Upstream SMTP relay
        {{- if .Values.emailGateway.upstream.host }}
        - name: UPSTREAM_HOST
          value: {{ .Values.emailGateway.upstream.host | quote }}
        {{- end }}
        - name: UPSTREAM_PORT
          value: {{ .Values.emailGateway.upstream.port | quote }}
        - name: UPSTREAM_TLS
          value: {{ .Values.emailGateway.upstream.tls | quote }}
        {{- if .Values.emailGateway.upstream.existingSecret }}
        - name: UPSTREAM_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.emailGateway.upstream.existingSecret }}
              key: username
        - name: UPSTREAM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.emailGateway.upstream.existingSecret }}
              key: password
        {{- else }}
        {{- if .Values.emailGateway.upstream.username }}
        - name: UPSTREAM_USERNAME
          value: {{ .Values.emailGateway.upstream.username | quote }}
        {{- end }}
        {{- if .Values.emailGateway.upstream.password }}
        - name: UPSTREAM_PASSWORD
          value: {{ .Values.emailGateway.upstream.password | quote }}
        {{- end }}
        {{- end }}
        # MnemoShare API connection
        - name: MNEMOSHARE_API_URL
          value: "http://{{ include "mnemoshare.fullname" . }}:{{ .Values.service.port }}"
        {{- if .Values.emailGateway.existingAPIKeySecret }}
        - name: MNEMOSHARE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.emailGateway.existingAPIKeySecret }}
              key: gateway-api-key
        {{- else if .Values.emailGateway.apiKey }}
        - name: MNEMOSHARE_API_KEY
          value: {{ .Values.emailGateway.apiKey | quote }}
        {{- end }}
        # ICAP virus scanning
        {{- $icapURL := .Values.emailGateway.icap.url }}
        {{- if and (not $icapURL) (eq (include "mnemoshare.icapMode" .) "inCluster") }}
        {{- $icapURL = printf "icap://%s-clamav:1344/avscan" (include "mnemoshare.fullname" .) }}
        {{- end }}
        {{- if $icapURL }}
        - name: ICAP_URL
          value: {{ $icapURL | quote }}
        {{- end }}
        - name: ICAP_SERVICE
          value: {{ .Values.emailGateway.icap.service | quote }}
        - name: ICAP_TIMEOUT
          value: {{ .Values.emailGateway.icap.timeout | quote }}
        - name: ICAP_REQUIRED
          value: {{ .Values.emailGateway.icap.required | quote }}
        # DLP / scanning. PRESIDIO_ENABLED must be paired with PRESIDIO_URL
        # — internal/config/config.go reads PRESIDIO_ENABLED as a separate
        # bool defaulted false, so a URL alone doesn't activate the client.
        {{- if .Values.emailGateway.dlp.presidioUrl }}
        - name: PRESIDIO_ENABLED
          value: "true"
        - name: PRESIDIO_URL
          value: {{ .Values.emailGateway.dlp.presidioUrl | quote }}
        {{- end }}
        {{- if .Values.emailGateway.dlp.tikaUrl }}
        - name: TIKA_URL
          value: {{ .Values.emailGateway.dlp.tikaUrl | quote }}
        {{- end }}
        - name: DLP_AI_ENABLED
          value: {{ .Values.emailGateway.dlp.aiEnabled | quote }}
        {{- if .Values.emailGateway.dlp.aiProvider }}
        - name: AI_PROVIDER
          value: {{ .Values.emailGateway.dlp.aiProvider | quote }}
        {{- end }}
        {{- if .Values.emailGateway.dlp.aiModel }}
        - name: AI_MODEL
          value: {{ .Values.emailGateway.dlp.aiModel | quote }}
        {{- end }}
        {{- if .Values.emailGateway.dlp.existingAISecret }}
        - name: AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.emailGateway.dlp.existingAISecret }}
              key: ai-api-key
        {{- else if .Values.emailGateway.dlp.aiApiKey }}
        - name: AI_API_KEY
          value: {{ .Values.emailGateway.dlp.aiApiKey | quote }}
        {{- end }}
        # Worker pool
        - name: WORKER_COUNT
          value: {{ .Values.emailGateway.workerCount | quote }}
        - name: QUEUE_SIZE
          value: {{ .Values.emailGateway.queueSize | quote }}
        # Limits
        - name: MAX_RECIPIENTS
          value: {{ .Values.emailGateway.maxRecipients | quote }}
        - name: MAX_MESSAGE_SIZE
          value: {{ .Values.emailGateway.maxMessageSize | quote }}
        - name: MAX_ATTACHMENT_SIZE
          value: {{ .Values.emailGateway.maxAttachmentSize | quote }}
        {{- if .Values.emailGateway.requireTlsDomains }}
        - name: REQUIRE_TLS_DOMAINS
          value: {{ .Values.emailGateway.requireTlsDomains | quote }}
        {{- end }}
        # SMTP auth and sender validation
        - name: SMTP_AUTH_REQUIRED
          value: {{ .Values.emailGateway.smtpAuthRequired | quote }}
        {{- if .Values.emailGateway.smtpAllowedSenderDomains }}
        - name: SMTP_ALLOWED_SENDER_DOMAINS
          value: {{ .Values.emailGateway.smtpAllowedSenderDomains | quote }}
        {{- end }}
        - name: LISTEN_TLS_REQUIRED
          value: {{ .Values.emailGateway.listenTlsRequired | quote }}
        - name: PROXY_PROTOCOL
          value: {{ .Values.emailGateway.proxyProtocol | quote }}
        - name: AUTH_CACHE_TTL
          value: {{ .Values.emailGateway.authCacheTTL | quote }}
        - name: SENDER_CACHE_TTL
          value: {{ .Values.emailGateway.senderCacheTTL | quote }}
        {{- if or (eq .Values.emailGateway.mode "relay") (eq .Values.emailGateway.mode "inbound-relay") }}
        # Relay mode configuration
        {{- if .Values.emailGateway.relay.hosts }}
        - name: RELAY_HOSTS
          value: {{ .Values.emailGateway.relay.hosts | quote }}
        {{- end }}
        - name: RELAY_SPOOL_DIR
          value: {{ .Values.emailGateway.relay.spoolDir | quote }}
        - name: RELAY_RATE_LIMIT
          value: {{ .Values.emailGateway.relay.rateLimit | quote }}
        - name: RELAY_RATE_BURST
          value: {{ .Values.emailGateway.relay.rateBurst | quote }}
        {{- $srcOverridden := false }}
        {{- range .Values.emailGateway.extraEnv }}{{ if eq .name "RELAY_ALLOWED_SOURCE_CIDRS" }}{{ $srcOverridden = true }}{{ end }}{{ end }}
        {{- if not $srcOverridden }}
        {{- $src := .Values.emailGateway.relay.allowedSourceCIDRs }}
        {{- if kindIs "slice" $src }}{{ $src = join "," $src }}{{ end }}
        - name: RELAY_ALLOWED_SOURCE_CIDRS
          value: {{ required "emailGateway.relay.allowedSourceCIDRs is required in relay and inbound-relay modes: the IPs or CIDRs allowed to submit mail (in Kubernetes, the submitting pods' CIDR). The gateway refuses to start without it." $src | quote }}
        {{- end }}
        {{- if or .Values.emailGateway.relay.db.uri .Values.emailGateway.relay.db.existingSecret }}
        # Relay tokens live in the relay DB, so the AUTH requirement is only
        # rendered when one is configured (the gateway refuses to start otherwise).
        - name: RELAY_SMTP_AUTH_REQUIRED
          value: {{ .Values.emailGateway.relay.smtpAuthRequired | quote }}
        {{- end }}
        {{- if .Values.emailGateway.relay.dnsServers }}
        - name: DNS_SERVERS
          value: {{ .Values.emailGateway.relay.dnsServers | quote }}
        {{- end }}
        - name: RELAY_DB_NAME
          value: {{ .Values.emailGateway.relay.db.name | quote }}
        {{- if .Values.emailGateway.relay.db.existingSecret }}
        - name: RELAY_DB_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.emailGateway.relay.db.existingSecret }}
              key: relay-db-uri
        {{- else if .Values.emailGateway.relay.db.uri }}
        - name: RELAY_DB_URI
          value: {{ .Values.emailGateway.relay.db.uri | quote }}
        {{- end }}
        {{- if .Values.emailGateway.relay.existingAdminKeySecret }}
        - name: RELAY_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.emailGateway.relay.existingAdminKeySecret }}
              key: relay-admin-key
        {{- else if .Values.emailGateway.relay.adminKey }}
        - name: RELAY_ADMIN_KEY
          value: {{ .Values.emailGateway.relay.adminKey | quote }}
        {{- end }}
        {{- end }}
        # Health port
        - name: HEALTH_PORT
          value: "8081"
        # Encryption key for internal API secret derivation
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ if .Values.existingSecrets.encryption }}{{ .Values.existingSecrets.encryption }}{{ else }}{{ include "mnemoshare.fullname" . }}-secrets{{ end }}
              key: encryption-key
        # Explicit relay-host allow-list (distinct from upstream next-hop).
        {{- if .Values.emailGateway.relayHosts }}
        - name: RELAY_HOSTS
          value: {{ join "," .Values.emailGateway.relayHosts | quote }}
        {{- end }}
        {{- with (include "mnemoshare.emailGatewayMisdirectedEnv" .) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.emailGateway.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml .Values.emailGateway.resources | nindent 12 }}
        {{- if or $tlsSecret $relayMode }}
        volumeMounts:
        {{- if $tlsSecret }}
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true
        {{- end }}
        {{- if $relayMode }}
        - name: relay-spool
          mountPath: {{ .Values.emailGateway.relay.spoolDir }}
        {{- end }}
        {{- end }}
      {{- if or $tlsSecret $relayMode }}
      volumes:
      {{- if $tlsSecret }}
      - name: tls-certs
        secret:
          secretName: {{ $tlsSecret }}
      {{- end }}
      {{- if $relayMode }}
      - name: relay-spool
        persistentVolumeClaim:
          claimName: {{ $relayClaim }}
      {{- end }}
      {{- end }}
      {{- with .Values.emailGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.emailGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
{{- end }}
