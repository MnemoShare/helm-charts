{{- if .Values.migrationOperation.enabled }}
{{- $phase := .Values.migrationOperation.phase | default "" }}
{{- $fingerprint := .Values.migrationOperation.contractFingerprint | default "" }}
{{- $hasRelayUniverse := false }}
{{- if .Values.emailGateway.enabled }}
{{- $emailFacts := include "mnemoshare.emailGateway" . | fromJson }}
{{- range $emailFacts.profile.external_universes }}
{{- if eq .id "email-relay-mongo" }}{{- $hasRelayUniverse = true }}{{- end }}
{{- end }}
{{- end }}
{{- $_ := include "mnemoshare.migrationOperationTargetImage" . }}
{{- if not (regexMatch "^[a-f0-9]{64}$" $fingerprint) }}
{{- fail "migrationOperation.contractFingerprint must be a 64-character lowercase hex digest" }}
{{- end }}
{{- if ne $fingerprint (include "mnemoshare.migrationOperationExpectedContractFingerprint" .) }}
{{- fail (printf "migrationOperation.contractFingerprint %s does not match the chart's vendored migration-operation/v1 contract %s" $fingerprint (include "mnemoshare.migrationOperationExpectedContractFingerprint" .)) }}
{{- end }}
{{- if not (has $phase (list "plan" "down" "apply" "verify" "up")) }}
{{- fail "migrationOperation.phase must be one of plan, down, apply, verify, or up when migrationOperation.enabled=true" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (.Values.migrationOperation.operationId | default "")) }}
{{- fail "migrationOperation.operationId must be a DNS label; bump it for every retry because migration Jobs are retained" }}
{{- end }}
{{- $universe := .Values.migrationOperation.universe | default "primary" }}
{{- if not (has $universe (list "primary" "email-relay-mongo")) }}
{{- fail "migrationOperation.universe must be one of the universes in the vendored v1 contract: primary or email-relay-mongo" }}
{{- end }}
{{- if and (eq $universe "email-relay-mongo") (not $hasRelayUniverse) }}
{{- fail "migrationOperation.universe=email-relay-mongo requires a configured emailGateway profile that declares that external universe" }}
{{- end }}
{{- if and (eq $universe "email-relay-mongo") (not .Values.emailGateway.relay.db.existingSecret) }}
{{- fail "migrationOperation.universe=email-relay-mongo requires emailGateway.relay.db.existingSecret" }}
{{- end }}
{{- if eq .Values.database.driver "sqlite" }}
{{- fail "migrationOperation.enabled is not supported with database.driver=sqlite until the controller provisions the application data volume" }}
{{- end }}
{{- if has $phase (list "apply" "verify" "up") }}
{{- if not (regexMatch "^[a-f0-9]{64}$" (.Values.migrationOperation.planDigest | default "")) }}
{{- fail "migrationOperation.planDigest must be a 64-character lowercase hex digest for apply, verify, and up" }}
{{- end }}
{{- end }}
{{- if eq $phase "up" }}
{{- if ne (.Values.migrationOperation.planDigest | default "") (.Values.migrationOperation.verifiedPlanDigest | default "") }}
{{- fail "migrationOperation.phase=up requires verifiedPlanDigest to equal planDigest after an external verify succeeded" }}
{{- end }}
{{- if and $hasRelayUniverse (ne (.Values.migrationOperation.externalPlanDigest | default "") (.Values.migrationOperation.verifiedExternalPlanDigest | default "")) }}
{{- fail "migrationOperation.phase=up requires verifiedExternalPlanDigest to equal externalPlanDigest for email-relay-mongo" }}
{{- end }}
{{- end }}
{{- if and (eq $phase "down") $hasRelayUniverse }}
{{- if not (regexMatch "^[a-f0-9]{64}$" (.Values.migrationOperation.externalPlanDigest | default "")) }}
{{- fail "migrationOperation.phase=down requires externalPlanDigest for email-relay-mongo before writers are drained" }}
{{- end }}
{{- end }}
{{- if has $phase (list "plan" "apply" "verify") }}
{{- if not .Values.migrationOperation.transport.existingClaim }}
{{- fail "migrationOperation.transport.existingClaim is required for plan, apply, and verify" }}
{{- end }}
{{- if or (gt (len .Values.migrationOperation.transport.existingClaim) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.migrationOperation.transport.existingClaim)) }}
{{- fail "migrationOperation.transport.existingClaim must be a DNS label no longer than 63 characters" }}
{{- end }}
{{- end }}
{{- end }}
