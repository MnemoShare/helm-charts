{{- if .Values.emailGateway.enabled }}
{{- $spool := include "mnemoshare.emailGatewaySpool" . | fromJson }}
{{- if and $spool.persistence $spool.persistence.enabled (not $spool.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mnemoshare.fullname" . }}-{{ $spool.claimSuffix }}
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-gateway
spec:
  accessModes:
    {{- range $spool.persistence.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ $spool.persistence.size }}
  {{- if $spool.persistence.storageClass }}
  storageClassName: {{ $spool.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
