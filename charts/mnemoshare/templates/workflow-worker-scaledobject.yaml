{{- if and .Values.workflowWorker.enabled .Values.workflowWorker.autoscaling.enabled (ne (include "mnemoshare.migrationOperationDown" .) "true") }}
{{- $prometheus := .Values.workflowWorker.autoscaling.prometheus | default dict }}
{{- if and $prometheus.serverAddress (not .Values.workflowWorker.metrics.enabled) }}
{{- fail "workflowWorker.autoscaling.prometheus.serverAddress requires workflowWorker.metrics.enabled=true: the backlog metric is served by the worker pods' metrics listener." }}
{{- end }}
{{- /*
KEDA's Redis trigger needs a concrete host:port to poll queue depth. The
`urlExistingSecret` path is for the app's REDIS_URL only — KEDA can't
read it because secret values aren't available at template time and the
trigger contract expects an explicit address (or a sentinel address
list). If a user sets both `urlExistingSecret` and autoscaling without
also providing `redis.external.host`, fail loudly rather than render a
ScaledObject with `address: ":6379"` that silently can't connect.
*/}}
{{- if and
      (not $prometheus.serverAddress)
      (eq (include "mnemoshare.redisMode" .) "external")
      .Values.redis.external.urlExistingSecret
      (not .Values.redis.external.host)
}}
{{- fail (printf
  "workflowWorker.autoscaling requires redis.external.host:port for KEDA's Redis trigger. The redis.external.urlExistingSecret path (set to %q) only wires REDIS_URL into the app/worker pods — KEDA polls Redis directly and needs an explicit address. Set redis.external.host (and optionally port) to one of your Redis/Sentinel endpoints, or disable workflowWorker.autoscaling."
  .Values.redis.external.urlExistingSecret) }}
{{- end }}
{{- $redisAddress := "" }}
{{- if eq (include "mnemoshare.redisMode" .) "external" }}
{{- $redisAddress = printf "%s:%s" .Values.redis.external.host (toString (.Values.redis.external.port | default 6379)) }}
{{- else }}
{{- $redisAddress = printf "%s-redis.%s.svc.cluster.local:6379" (include "mnemoshare.fullname" .) .Release.Namespace }}
{{- end }}
{{- $hasAuth := false }}
{{- if eq (include "mnemoshare.redisMode" .) "external" }}
{{- $hasAuth = or (not (empty .Values.redis.external.existingSecret)) (not (empty .Values.existingSecrets.redis)) }}
{{- else }}
{{- $hasAuth = or (not (empty .Values.redis.password)) (not (empty .Values.redis.existingSecret)) }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "mnemoshare.fullname" . }}-worker
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-worker
spec:
  scaleTargetRef:
    name: {{ include "mnemoshare.fullname" . }}-worker
    {{- if .Values.workflowWorker.persistence.enabled }}
    kind: StatefulSet
    {{- end }}
  minReplicaCount: {{ .Values.workflowWorker.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.workflowWorker.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.workflowWorker.autoscaling.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.workflowWorker.autoscaling.cooldownPeriod | default 60 }}
  triggers:
  {{- if $prometheus.serverAddress }}
  # Claimable workflow rows in messaging_outbox: the backlog this worker's
  # messaging engine drains. On this application line Redis only carries
  # doorbells (one Asynq task per outbox row, consumed immediately), so the
  # Redis list triggers below never measure backlog; this is the real signal.
  - type: prometheus
    metadata:
      serverAddress: {{ $prometheus.serverAddress | quote }}
      query: {{ $prometheus.query | default (printf "sum(mnemoshare_dispatch_backlog_rows{namespace=%q,process=\"workflow-worker\"})" .Release.Namespace) | quote }}
      threshold: {{ $prometheus.threshold | default "20" | quote }}
      activationThreshold: {{ $prometheus.activationThreshold | default "0" | quote }}
    {{- if $prometheus.authenticationRef }}
    authenticationRef:
      name: {{ $prometheus.authenticationRef | quote }}
    {{- end }}
  {{- else }}
  # Legacy Redis list triggers. The application's Asynq doorbell queues are
  # keyspaced (<customerId>:dispatch-default / -high) and hold only row IDs
  # until a worker dequeues them, so these lists do not track backlog; set
  # workflowWorker.autoscaling.prometheus.serverAddress to scale on it.
  # Scale based on pending tasks in the default queue
  - type: redis
    metadata:
      # Use FQDN for cross-namespace resolution (KEDA runs in keda namespace)
      address: {{ $redisAddress }}
      # Asynq uses list keys for pending tasks
      listName: "asynq:default:pending"
      listLength: {{ .Values.workflowWorker.autoscaling.listLengthTarget | default "5" | quote }}
      # Use the database number
      databaseIndex: {{ .Values.redis.external.db | default "0" | quote }}
      {{- if $hasAuth }}
      enableTLS: "false"
      {{- end }}
    {{- if $hasAuth }}
    authenticationRef:
      name: {{ include "mnemoshare.fullname" . }}-redis-trigger-auth
    {{- end }}
  # Also scale based on critical queue
  - type: redis
    metadata:
      address: {{ $redisAddress }}
      listName: "asynq:critical:pending"
      listLength: {{ .Values.workflowWorker.autoscaling.listLengthTarget | default "5" | quote }}
      databaseIndex: {{ .Values.redis.external.db | default "0" | quote }}
    {{- if $hasAuth }}
    authenticationRef:
      name: {{ include "mnemoshare.fullname" . }}-redis-trigger-auth
    {{- end }}
  # And low priority queue
  - type: redis
    metadata:
      address: {{ $redisAddress }}
      listName: "asynq:low:pending"
      listLength: {{ .Values.workflowWorker.autoscaling.listLengthTarget | default "5" | quote }}
      databaseIndex: {{ .Values.redis.external.db | default "0" | quote }}
    {{- if $hasAuth }}
    authenticationRef:
      name: {{ include "mnemoshare.fullname" . }}-redis-trigger-auth
    {{- end }}
  {{- end }}
{{- end }}
