{{- /* Trigger presence is validated by ices-scaledobject.yaml; this only binds credentials for the gcp-pubsub trigger. */}}
{{- if and .Values.ices.enabled .Values.ices.autoscaling.enabled (ne (include "mnemoshare.migrationOperationDown" .) "true") .Values.ices.autoscaling.subscriptionName }}
{{- if .Values.ices.autoscaling.credentialsFromSecret.name }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "mnemoshare.fullname" . }}-ices-pubsub-auth
  labels:
    {{- include "mnemoshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: ices
spec:
  secretTargetRef:
  - parameter: GoogleApplicationCredentials
    name: {{ .Values.ices.autoscaling.credentialsFromSecret.name }}
    key: {{ .Values.ices.autoscaling.credentialsFromSecret.key | default "gcp-credentials.json" }}
{{- end }}
{{- end }}
