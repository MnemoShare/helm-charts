{{- if include "mnemoshare.keyguard.enabled" . }}
{{- /*
cert-manager Certificate requesting a workload mTLS client cert with a SPIFFE
URI SAN. The sidecar (cmd/federation-sidecar) presents this cert when calling
the idp-lite federation listener; the listener verifies the SAN against the
WorkloadIdentity allow-list.

identityMode=shared renders one Certificate for the release ServiceAccount.
identityMode=perComponent renders one per federated component, each bound to
that component's own ServiceAccount, so no pod mounts another component's key.

Rendered only when keyguard.enabled=true. Prereq: cert-manager + an
Issuer/ClusterIssuer that can sign SPIFFE URI SANs (step-issuer fronting
Step-CA is the reference setup).
*/ -}}
{{- $components := list "api" -}}
{{- if include "mnemoshare.keyguard.perComponent" . -}}
{{- if .Values.workflowWorker.enabled }}{{- $components = append $components "worker" -}}{{- end -}}
{{- if .Values.ices.enabled }}{{- $components = append $components "ices" -}}{{- end -}}
{{- else -}}
{{- $components = list "shared" -}}
{{- end -}}
{{- range $component := $components }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mnemoshare.keyguard.certName" $ctx }}
  labels:
    {{- include "mnemoshare.labels" $ | nindent 4 }}
    app.kubernetes.io/component: keyguard
spec:
  secretName: {{ include "mnemoshare.keyguard.certName" $ctx }}
  duration: {{ $.Values.keyguard.cert.duration | default "24h" }}
  renewBefore: {{ $.Values.keyguard.cert.renewBefore | default "8h" }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  # RFC 5480 §3: keyEncipherment is meaningful only for RSA
  # key-transport — it MUST NOT be set for EC keys. cert-manager
  # >= 1.8 enforces this and rejects the CertificateRequest if
  # set, blocking pod startup. Correct set for an ECDSA mTLS
  # client cert is `client auth` + `digital signature`.
  usages:
    - client auth
    - digital signature
  uris:
    - {{ include "mnemoshare.keyguard.spiffeID" $ctx }}
  issuerRef:
    name: {{ required "keyguard.cert.issuerName is required when keyguard.enabled=true" $.Values.keyguard.cert.issuerName }}
    kind: {{ $.Values.keyguard.cert.issuerKind | default "ClusterIssuer" }}
    group: {{ $.Values.keyguard.cert.issuerGroup | default "cert-manager.io" }}
{{- end }}
{{- end }}
